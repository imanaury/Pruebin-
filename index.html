<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tejidos epiteliales</title>
<style>
:root{--bg:#faf6f8;--card:#fff;--tx:#2a1f26;--mu:#6e5c67;--ac:#a3306b;--ac2:#fbe4ef;--bd:#ecd9e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1217;--card:#261a22;--tx:#f4e9ef;--mu:#b9a3af;--ac:#f08cbc;--ac2:#3a2230;--bd:#43303c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1217;--card:#261a22;--tx:#f4e9ef;--mu:#b9a3af;--ac:#f08cbc;--ac2:#3a2230;--bd:#43303c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;padding:24px 0 8px}
h1{font-size:1.9rem;margin:0 0 6px;color:var(--ac)}
header p{margin:0;color:var(--mu);font-family:system-ui,sans-serif;font-size:.95rem}
h2{font-size:1.25rem;margin:32px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.c>div:last-child{flex:1;min-width:0}
.n{flex:0 0 36px;height:36px;border-radius:50%;background:var(--ac);color:var(--bg);display:grid;place-items:center;font:700 1rem system-ui,sans-serif}
.c h3{margin:0 0 6px;font-size:1.02rem;font-weight:600}
.s{font-family:system-ui,sans-serif;color:var(--mu);font-size:.9rem;margin:0 0 8px}
input{width:100%;max-width:320px;background:var(--ac2);color:var(--ac);border:1px solid transparent;border-radius:999px;padding:5px 14px;font:600 .92rem system-ui,sans-serif}
input::placeholder{color:var(--mu);font-weight:400}
input:not([readonly]):hover{border-color:var(--bd)}
input:focus{outline:2px solid var(--ac);outline-offset:1px;background:var(--card)}
input[readonly]{cursor:default}
.t{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.92rem;background:var(--card);border:1px solid var(--bd)}
.t th,.t td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
.t th{background:var(--ac2);color:var(--ac)}
.t tr:last-child td{border-bottom:0}
.sc{overflow-x:auto;border-radius:12px}
.pr{display:flex;flex-wrap:wrap;gap:8px}
.pr input{max-width:240px}
footer{text-align:center;color:var(--mu);font:.8rem system-ui,sans-serif;margin-top:36px}
</style>
</head>
<body>
<div class="w">
<header>
<h1>Tejidos epiteliales</h1>
<p>Lista de epitelios y distribución del equipo</p>

</header>

<h2>Lista de tejidos epiteliales</h2>
<div id="lista"></div>

<h2>Ubicación de los epitelios</h2>
<p class="s">Propuesta: entre 4 personas se aprenden la ubicación de los epitelios.</p>
<div class="sc"><table class="t" id="ubi"></table></div>

<h2>Presentadores</h2>
<div class="pr" id="pres"></div>

<h2>Temas de apoyo</h2>
<div id="apoyo"></div>

<footer>Toca un nombre para escribirlo o cambiarlo.</footer>
</div>
<script>
var D={e1:"@lennybel",e2:"",e3:"@Ary 🌻",e4:"",e5:"",e6:"",e7:"",e8:"@Nati",e9:"@medilin",e10:"@Camila",
l1:"@Deirihanna Azcona",l2:"@daibel",l3:"@Abby 🫀",l4:"",p1:"@Alex",p2:"@Esther M. Herrera 🤍",
t5:"",t6:"",t7:"Manauri",t8:"",t9:"@Shay valencio",t10:""};
var E=[
"Tejido epitelial plano simple","Tejido epitelial cúbico simple","Tejido epitelial cilíndrico simple",
"Tejido epitelial cilíndrico pseudoestratificado","Tejido epitelial cilíndrico pseudoestratificado con estereocilios",
"Tejido epitelial cilíndrico pseudoestratificado ciliado con células caliciformes (epitelio respiratorio)",
"Tejido epitelial cilíndrico simple con chapa estriada y células caliciformes",
"Tejido epitelial plano estratificado queratinizado","Tejido epitelial plano estratificado no queratinizado",
"Urotelio o epitelio de transición"];
var L=[["Persona 1","1 y 2"],["Persona 2","3, 4 y 5"],["Persona 3","6 y 7"],["Persona 4","8, 9 y 10"]];
var T=[
["Características generales de todos los epitelios","Avascularidad, polaridad y cómo se nutren."],
["Cilios y estereocilios","Qué son y para qué sirven (epitelios 5, 6 y 7)."],
["Microvellosidades y chapa estriada","Qué son y para qué sirven (epitelio 7)."],
["Células caliciformes","Qué son, qué secretan y en cuáles epitelios están (6 y 7)."],
["Queratina","Qué es, por qué el epitelio 8 la tiene y por qué el epitelio 9 no la necesita."],
["Células en paraguas del urotelio","Cómo se estiran cuando hay orina (epitelio 10)."]];
var DB_URL="";/* Pega aquí la URL de tu Firebase Realtime Database, sin "/" al final. Ejemplo: https://epitelios-default-rtdb.firebaseio.com */
var vals=Object.assign({},D),inputs={};
function inp(k){var i=document.createElement("input");i.type="text";i.maxLength=80;i.placeholder="Por asignar";i.value=vals[k];i.setAttribute("aria-label","Responsable");i.addEventListener("change",function(){save(k,i.value.trim())});
inputs[k]=i;return i}
function card(n,title,sub,k){var c=document.createElement("div");c.className="c";
var a=document.createElement("div");a.className="n";a.textContent=n;var b=document.createElement("div");
var h=document.createElement("h3");h.textContent=title;b.appendChild(h);
if(sub){var p=document.createElement("p");p.className="s";p.textContent=sub;b.appendChild(p)}
b.appendChild(inp(k));c.appendChild(a);c.appendChild(b);return c}
var lista=document.getElementById("lista");
E.forEach(function(t,i){lista.appendChild(card(i+1,t,null,"e"+(i+1)))});
var ubi=document.getElementById("ubi");
ubi.innerHTML="<tr><th>Persona</th><th>Epitelios</th><th>Responsable</th></tr>";
L.forEach(function(r,i){var tr=document.createElement("tr");
[r[0],r[1]].forEach(function(x){var td=document.createElement("td");td.textContent=x;tr.appendChild(td)});
var td=document.createElement("td");td.appendChild(inp("l"+(i+1)));tr.appendChild(td);ubi.appendChild(tr)});
var pres=document.getElementById("pres");pres.appendChild(inp("p1"));pres.appendChild(inp("p2"));
var ap=document.getElementById("apoyo");
T.forEach(function(t,i){ap.appendChild(card(i+5,t[0],t[1],"t"+(i+5)))});
function apply(){Object.keys(inputs).forEach(function(k){if(document.activeElement!==inputs[k])inputs[k].value=vals[k]})}
function merge(o){if(!o)return;Object.keys(o).forEach(function(k){if(k in D&&typeof o[k]==="string")vals[k]=o[k]})}
function save(k,v){vals[k]=v;
if(DB_URL){var b={};b[k]=v;fetch(DB_URL+"/asig.json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).catch(function(){})}
else{try{localStorage.setItem("epitelios",JSON.stringify(vals))}catch(e){}}}
function load(){if(DB_URL){fetch(DB_URL+"/asig.json").then(function(r){return r.json()}).then(function(o){merge(o);apply()}).catch(function(){})}}
if(!DB_URL){try{merge(JSON.parse(localStorage.getItem("epitelios")))}catch(e){}}
apply();load();if(DB_URL)setInterval(load,5000);
</script>
</body>
</html>
